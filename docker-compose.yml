services:
  civic-ai:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/civic_ai.db
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    volumes:
      - civic-ai-data:/data

volumes:
  civic-ai-data:
