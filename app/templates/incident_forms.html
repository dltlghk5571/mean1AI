{% macro confirmation(action, label, button, key='', complaint_id='') %}
  {% set field_id = action ~ key %}
  {% set is_retry = failed_action|default('') == action and (not complaint_id or form.get('complaint_id') == complaint_id) %}
  <input type="hidden" name="csrf_token" value="{{ current_user.csrf_token }}">
  {% if incident %}<input type="hidden" name="revision" value="{{ incident.revision }}">{% endif %}
  <label for="reason-{{ field_id }}">검토 사유</label>
  <textarea id="reason-{{ field_id }}" name="reason" required minlength="5" maxlength="500" rows="2" placeholder="같은 시설·발생 시점 등 확인한 내용을 5자 이상 적어 주세요.">{{ form.get('reason', '') if is_retry else '' }}</textarea>
  <label class="incident-confirm" for="confirm-{{ field_id }}"><input id="confirm-{{ field_id }}" type="checkbox" name="confirm" value="yes" required><span>{{ label }}</span></label>
  <p class="incident-error" data-incident-error role="alert" tabindex="-1" hidden></p>
  <button type="submit" class="button button-primary">{{ button }}</button>
{% endmacro %}
