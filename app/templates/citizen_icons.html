{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'arrow' %}<path d="M4 12h15m-5-5 5 5-5 5"/>
{% elif name == 'back' %}<path d="M20 12H5m5-5-5 5 5 5"/>
{% elif name == 'write' %}<path d="M14 5 19 10M4 20l5-1 12-12-5-5L4 14zM13 20h7"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'road' %}<path d="m8 3-5 18M16 3l5 18M12 4v3m0 4v3m0 4v3"/>
{% elif name == 'light' %}<path d="M8 21V6a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v2M14 8h6l1 4h-8zM5 21h6m4-6 1 2m4-2-1 2"/>
{% elif name == 'waste' %}<path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/>
{% elif name == 'park' %}<path d="m12 2-7 9h3l-4 6h7v5m1-20 7 9h-3l4 6h-9M8 22h8"/>
{% elif name == 'chat' %}<path d="M20 11a8 8 0 0 1-8 8H4l1-5a8 8 0 1 1 15-3Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6zM8 12l3 3 5-6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'pin' %}<path d="M19 9c0 6-7 12-7 12S5 15 5 9a7 7 0 1 1 14 0Z"/><circle cx="12" cy="9" r="2.5"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'copy' %}<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/>
{% endif %}</svg>
{%- endmacro %}
