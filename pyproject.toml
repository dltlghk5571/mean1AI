[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seongnam-civic-ai"
version = "0.1.0"
description = "Human-in-the-loop civic complaint triage MVP for Seongnam"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seongnam Civic AI MVP contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "openai>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "data/*.json", "data/knowledge/*.md"]
evals = ["fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app"]
branch = true
